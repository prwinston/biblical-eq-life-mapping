name = "biblical-eq-assessment"
compatibility_date = "2026-09-19"

# This is a plain static site (no build step, no Worker script) — served
# directly from the repo root as static assets. This config works with
# `npx wrangler deploy` (Cloudflare's Git-connected "Workers Builds" runs
# that command by default, even for a static-only project) and does NOT
# need `wrangler pages deploy`.
[assets]
directory = "."
not_found_handling = "single-page-application"
